server {
    listen 80;
    server_name localhost;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Default location for HTML
    location / {
        include /etc/nginx/snippets/natipsy-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";

        try_files $uri $uri/ /index.html;
    }

    # Hashed build artifacts (e.g. main-XMWJPNV4.js, styles-Q7GUAVUT.css):
    # the 8-char content hash in the filename changes on every rebuild,
    # so these are safe to cache immutably for a year.
    # The shared header include is repeated as an include (not copied policy)
    # because Nginx stops inheriting add_header directives once a block
    # declares any of its own. Regex locations match in file order — this block must
    # stay before the generic static-media block below.
    location ~* "-[A-Za-z0-9]{8}\.(?:js|css)$" {
        expires 1y;
        access_log off;
        include /etc/nginx/snippets/natipsy-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unhashed static media (logo.png, NatiHero.webp, favicon.ico, ...):
    # filenames carry no build hash, so a 1-year immutable cache would pin
    # stale assets for up to a year after an update. Cache for 7 days with
    # ETag/Last-Modified revalidation instead.
    location ~* \.(?:ico|gif|jpe?g|png|webp|svg|woff2?|eot|ttf)$ {
        expires 7d;
        access_log off;
        include /etc/nginx/snippets/natipsy-security-headers.conf;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        include /etc/nginx/snippets/natipsy-security-headers.conf;
    }
}
