<section
  class="bg-primary-blue py-16 sm:py-24 px-4 sm:px-6 lg:px-8 text-white"
  aria-labelledby="vantagens-heading"
>
  <div class="max-w-7xl mx-auto">
    <h2 id="vantagens-heading" class="text-3xl sm:text-4xl font-bold text-white text-center mb-12">
      Vantagens da Terapia Online
    </h2>
    <ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" role="list">
      @for (advantage of advantages; track advantage.title) {
        <li
          class="bg-white rounded-2xl shadow-sm hover:shadow-md p-6 sm:p-8 transition-all duration-300 ease-in-out motion-safe:hover:-translate-y-1 border border-rose-100/60"
        >
          <div
            class="mb-5 flex h-14 w-14 items-center justify-center rounded-2xl bg-primary-pink/30"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-8 w-8 text-primary-pink-dark"
              aria-hidden="true"
              width="32"
              height="32"
            >
              <path [attr.d]="advantage.iconPath" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
          <h3 class="text-xl font-semibold text-primary-blue mb-2">{{ advantage.title }}</h3>
          <p class="text-gray-600">{{ advantage.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
