<section
  class="services-section py-16 sm:py-24 px-4 sm:px-6 lg:px-8 bg-surface-warm border-y border-rose-100/40"
  aria-labelledby="services-heading"
>
  <div class="container mx-auto">
    <h2
      id="services-heading"
      class="text-3xl sm:text-4xl md:text-5xl font-bold text-primary-blue mb-8 sm:mb-10 text-center relative"
    >
      Como posso te ajudar
      <span
        class="absolute bottom-[-6px] left-1/2 transform -translate-x-1/2 w-4/5 sm:w-3/5 h-1 bg-primary-pink-dark/40"
        aria-hidden="true"
      ></span>
    </h2>
    <ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8" role="list">
      @for (service of services; track service.title) {
        <li
          class="flex flex-col bg-white p-6 sm:p-8 rounded-2xl border border-rose-100/60 shadow-sm hover:shadow-md motion-safe:hover:-translate-y-1 transition-all duration-300"
        >
          <article class="flex flex-col flex-grow">
            <header class="flex items-center mb-6">
              <img
                [ngSrc]="service.iconPath"
                alt=""
                class="bg-primary-pink/30 p-3 rounded-2xl shrink-0"
                aria-hidden="true"
                width="64"
                height="64"
              />
              <h3 class="min-w-0 break-words text-xl font-bold text-primary-blue ml-4">
                {{ service.title }}
              </h3>
            </header>
            <p class="text-base sm:text-lg md:text-xl text-gray-700 leading-relaxed">
              {{ service.description }}
            </p>
          </article>
        </li>
      }
    </ul>
    <div class="mt-10 flex justify-center">
      <a
        [href]="whatsappLink"
        target="_blank"
        rel="noopener noreferrer"
        class="inline-flex items-center gap-2.5 bg-primary-blue text-white font-bold py-3 px-6 text-lg rounded-full shadow-md hover:bg-primary-blue/90 hover:shadow-lg motion-safe:hover:-translate-y-0.5 transition-all duration-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary-blue focus-visible:ring-offset-2 focus-visible:ring-offset-surface-warm"
        aria-label="Agende sua consulta sobre os serviços"
      >
        <img
          src="/assets/icons/whatsapp.svg"
          alt=""
          class="w-5 h-5 shrink-0"
          aria-hidden="true"
          width="20"
          height="20"
        />
        Agende sua consulta
      </a>
    </div>
  </div>
</section>
