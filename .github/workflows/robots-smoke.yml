name: Production robots smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '27 6 * * *'

permissions:
  contents: read

jobs:
  robots:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Verify live robots policy
        run: |
          if node scripts/robots-smoke-check.mjs; then
            exit 0
          fi
          echo 'First robots attempt failed; retrying once to require two consecutive failures.' >&2
          node scripts/robots-smoke-check.mjs
