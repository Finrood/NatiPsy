name: Nginx live contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Exercise the live Nginx contract
        run: npm run test:nginx:live
