# Shared browser security policy. Include this from every location that sets
# any add_header directive because Nginx stops inheriting parent headers then.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
# Angular's current SSR output contains inline hydration/event-replay code and
# critical styles. Keep these directives until a build-time nonce/hash strategy
# is measured; all network destinations remain explicit and same-origin by
# default. AUD-023 removes the temporary Google font origins.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
